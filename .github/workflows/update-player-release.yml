name: Update player release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable player release tag (blank syncs latest)
        required: false
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: update-player-release
  cancel-in-progress: false

jobs:
  update-player:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the release updater
        run: node --test tests/player-release.test.mjs
      - name: Update player download links and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/update-player-release.mjs
      - name: Commit the updated player page
        run: |
          set -euo pipefail
          git add player/index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update player downloads to latest release'
            git push origin HEAD:master
          fi
      # This site deploys from master. A GITHUB_TOKEN push does not start Pages,
      # so explicitly request a build, including on retries with no file changes.
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
