<!DOCTYPE html>
<html lang="en">
<head>

    <title>Extract MP3 Chapters as Podlove XML</title>

    <div class="container py-4 mt-3" style="max-width: 800px;">
        <h1 class="mb-3">Extract MP3 Chapters as Podlove XML</h1>
        <p class="text-body-secondary mb-3">Upload an MP3 file to extract chapters from its ID3 tags, or paste a plain text chapter list. Output is Podlove Simple Chapters XML.</p>

        <div class="mb-3">
            <label for="mp3Input" class="form-label fw-bold">Upload MP3 file</label>
            <input type="file" accept=".mp3,audio/mpeg" class="form-control" id="mp3Input">
            <div class="form-text">Chapters will be extracted from the file's ID3 tags.</div>
        </div>

        <div class="mb-3">
            <label for="textInput" class="form-label fw-bold">Or paste chapters as text</label>
            <textarea class="form-control font-monospace" id="textInput" rows="6" placeholder="00:00 Introduction
01:30 Chapter 2"></textarea>
        </div>

        <button class="btn btn-primary mb-3" id="convertBtn">Convert</button>

        <div class="mb-3 d-none" id="outputSection">
            <label for="output" class="form-label fw-bold">Output (Podlove XML)</label>
            <textarea class="form-control font-monospace" id="output" rows="8" readonly></textarea>
            <div class="mt-2">
                <button class="btn btn-sm btn-outline-secondary" id="copyBtn">Copy</button>
                <button class="btn btn-sm btn-outline-secondary" id="downloadBtn">Download .psc</button>
            </div>
        </div>

        <div class="alert alert-danger d-none" id="error"></div>
    </div>

    <script src="../../libs/node-id3-browserify.js"></script>
    <script type="module">
        import { readChaptersFromMp3, parseTextChapters, chaptersToPodlove, downloadBlob } from '../converter-utils.js';

        document.getElementById('convertBtn').addEventListener('click', async () => {
            const mp3File = document.getElementById('mp3Input').files[0];
            const textInput = document.getElementById('textInput').value.trim();
            const errorEl = document.getElementById('error');
            const outputSection = document.getElementById('outputSection');
            errorEl.classList.add('d-none');
            outputSection.classList.add('d-none');

            try {
                let chapters;
                if (mp3File) {
                    chapters = await readChaptersFromMp3(mp3File);
                } else if (textInput) {
                    chapters = parseTextChapters(textInput);
                } else {
                    throw new Error('Please upload an MP3 file or paste chapter text.');
                }
                if (chapters.length === 0) throw new Error('No chapters found in input.');
                const result = chaptersToPodlove(chapters);
                document.getElementById('output').value = result;
                outputSection.classList.remove('d-none');
            } catch (e) {
                errorEl.textContent = 'Error: ' + e.message;
                errorEl.classList.remove('d-none');
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(document.getElementById('output').value);
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const blob = new Blob([document.getElementById('output').value], { type: 'application/xml' });
            downloadBlob(blob, 'chapters.psc');
        });
    </script>
</body>
</html>
