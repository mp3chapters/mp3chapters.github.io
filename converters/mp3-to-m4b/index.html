    <div class="container py-4 mt-3" style="max-width: 800px;">
        <h1 class="mb-3">MP3 &rarr; M4B Audiobook</h1>
        <p class="text-body-secondary mb-3">Convert an MP3 file to M4B audiobook format. Chapter metadata and cover art are preserved. The conversion runs locally in your browser using FFmpeg.</p>

        <div class="mb-3">
            <label for="mp3Input" class="form-label fw-bold">Select MP3 file</label>
            <input type="file" accept=".mp3,audio/mpeg" class="form-control" id="mp3Input">
            <div class="form-text">The file will be re-encoded to AAC at 128 kbps.</div>
        </div>

        <button class="btn btn-primary mb-3" id="convertBtn" disabled>Convert to M4B</button>

        <div class="progress mb-3 d-none" id="progressContainer" style="height: 25px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar" role="progressbar" style="width: 0%">Loading FFmpeg...</div>
        </div>

        <div class="alert alert-success d-none" id="success"></div>
        <div class="alert alert-danger d-none" id="error"></div>
    </div>

    <script type="module">
        import { convertToM4B } from '../../src/submodules/FFmpeg.js';
        import { downloadBlob } from '../converter-utils.js';

        const mp3Input = document.getElementById('mp3Input');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const errorEl = document.getElementById('error');
        const successEl = document.getElementById('success');

        mp3Input.addEventListener('change', () => {
            convertBtn.disabled = !mp3Input.files.length;
            errorEl.classList.add('d-none');
            successEl.classList.add('d-none');
        });

        convertBtn.addEventListener('click', async () => {
            const file = mp3Input.files[0];
            if (!file) return;

            convertBtn.disabled = true;
            errorEl.classList.add('d-none');
            successEl.classList.add('d-none');
            progressContainer.classList.remove('d-none');
            progressBar.style.width = '50%';
            progressBar.textContent = 'Converting...';

            try {
                const m4bBlob = await convertToM4B(file);
                const filename = file.name.replace(/\.[^/.]+$/, '') + '.m4b';
                downloadBlob(m4bBlob, filename);
                progressBar.style.width = '100%';
                progressBar.textContent = 'Done!';
                successEl.textContent = `Converted successfully. Download started for ${filename}.`;
                successEl.classList.remove('d-none');
            } catch (e) {
                errorEl.textContent = 'Error: ' + e.message;
                errorEl.classList.remove('d-none');
                progressContainer.classList.add('d-none');
            } finally {
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
